---
apiVersion: v1
kind: Pod
metadata:
  name: webapp
  labels:
    app: snifferwebapp
spec:
  containers:
    - name: javawebappcontainer
      image: hacker123shiva/springbt-in-docker:latest
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: webappsvc
spec:
  type: ClusterIP
  selector:
    app: snifferwebapp
  ports:
    - port: 80
      targetPort: 8080
...
